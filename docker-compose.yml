services:
  usuarios:
    build: ./usuarios
  productos:
    build: ./productos
  pedidos:
    build: ./pedidos
    environment:
      USUARIOS_URL: http://usuarios:5001
      PRODUCTOS_URL: http://productos:5002
    depends_on: [usuarios, productos]
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"        
    environment:
      USUARIOS_URL: http://usuarios:5001
      PRODUCTOS_URL: http://productos:5002
      PEDIDOS_URL: http://pedidos:5003
    depends_on: [usuarios, productos, pedidos]
